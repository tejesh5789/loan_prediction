<!DOCTYPE html>
<html>
<head>
    <title>Loan Approval Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            padding: 40px;
        }
        .form-container {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-top: 15px;
        }
        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 20px;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
        }
        .result {
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            color: #007BFF;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Loan Approval Form</h2>
        <form method="POST" action="/predict">
            <label for="income">Income:</label>
            <input type="number" name="Income" id="income" required>

            <label for="credit">Credit Score:</label>
            <input type="number" name="Credit_Score" id="credit" required>

            <label for="loan">Loan Amount:</label>
            <input type="number" name="Loan_Amount" id="loan" required>

            <label for="dti">DTI Ratio:</label>
            <input type="number" step="0.01" name="DTI_Ratio" id="dti" required>

            <label for="emp">Employment Status:</label>
            <select name="Emp_status" id="emp" required>
                <option value="employed">Employed</option>
                <option value="unemployed">Unemployed</option>
            </select>

            <button type="submit">Submit</button>
        </form>

        <!-- {% if result %} -->
        <div class="result">
            Loan Approval Result: {{ result }}
        </div>
        <!-- {% endif %} -->
    </div>
</body>
</html>
